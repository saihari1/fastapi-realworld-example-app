services:

  app:
    build: .
    restart: on-failure

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db/postgres"

    env_file:
      - .env

    depends_on:
      - db
      - jaeger

  db:
    image: postgres:11.5-alpine

    ports:
      - "5432:5432"

    env_file:
      - .env

    volumes:
      - ./postgres-data:/var/lib/postgresql/data:cached

  jaeger:
    image: jaegertracing/all-in-one:1.54

    ports:
      - "16686:16686"
      - "6831:6831/udp"
